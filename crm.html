    <style>
        :root {
            --accent-gold: #e5c158;
            --accent-gold-glow: rgba(229, 193, 88, 0.35);
            --text-main: #f8f4eb;
            --text-muted: #c9c0b1;
            --glass-card: rgba(20, 16, 15, 0.94);
            --glass-border: rgba(229, 193, 88, 0.3);
            --bg-dark: #090707;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            padding: 24px 4%;
            position: relative;
        }

        .bg-glow {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 80% 20%, rgba(229, 193, 88, 0.08) 0%, transparent 60%),
                        radial-gradient(circle at 10% 80%, rgba(184, 143, 38, 0.05) 0%, transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        .crm-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 28px;
        }

        .brand-block { display: flex; align-items: center; gap: 16px; }
        .brand-logo {
            width: 54px; height: 54px; border-radius: 50%;
            border: 2px solid var(--accent-gold); object-fit: cover;
            box-shadow: 0 0 15px var(--accent-gold-glow);
        }
        .brand-title { font-family: 'Cormorant Garamond', serif; font-size: 28px; color: var(--accent-gold); line-height: 1.2; }
        .brand-subtitle { font-size: 13px; color: var(--text-muted); }

        .header-actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

        .btn-nav {
            padding: 10px 20px; border-radius: 50px; font-size: 13px; font-weight: 600;
            text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
            transition: 0.3s; cursor: pointer;
        }
        .btn-nav-primary {
            background: linear-gradient(135deg, #e5c158, #b88f26); color: #000;
            border: none; box-shadow: 0 0 20px var(--accent-gold-glow);
        }
        .btn-nav-primary:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(229, 193, 88, 0.6); }
        .btn-nav-secondary { background: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid var(--glass-border); }
        .btn-nav-secondary:hover { background: rgba(229, 193, 88, 0.15); color: var(--accent-gold); }

        .controls-card {
            background: var(--glass-card); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 20px; margin-bottom: 24px;
            display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
            gap: 16px; backdrop-filter: blur(12px);
        }

        .search-box { flex: 1; min-width: 260px; position: relative; }
        .search-box input {
            width: 100%; padding: 12px 16px 12px 42px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border); border-radius: 12px; color: #fff;
            font-size: 14px; outline: none; font-family: inherit; transition: 0.3s;
        }
        .search-box input:focus { border-color: var(--accent-gold); box-shadow: 0 0 15px var(--accent-gold-glow); }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 16px; }

        .filter-pills { display: flex; gap: 8px; flex-wrap: wrap; }
        .pill {
            padding: 8px 16px; border-radius: 50px; font-size: 12px; font-weight: 600;
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted); cursor: pointer; transition: 0.25s;
        }
        .pill:hover, .pill.active {
            background: var(--accent-gold); color: #000; border-color: var(--accent-gold);
            box-shadow: 0 0 12px var(--accent-gold-glow);
        }

        .table-card {
            background: var(--glass-card); border: 1px solid var(--glass-border);
            border-radius: 20px; overflow: hidden; backdrop-filter: blur(12px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        thead { background: rgba(0, 0, 0, 0.6); border-bottom: 1px solid var(--glass-border); }
        th {
            padding: 16px 18px; color: var(--accent-gold); font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.8px; font-size: 11px; white-space: nowrap;
        }
        tbody tr { border-bottom: 1px solid rgba(255, 255, 255, 0.05); transition: 0.2s ease; }
        tbody tr:hover { background: rgba(229, 193, 88, 0.05); }
        td { padding: 14px 18px; color: var(--text-main); vertical-align: middle; }

        .guest-phone { color: var(--accent-gold); text-decoration: none; font-family: monospace; font-size: 13px; }

        .badge-type {
            display: inline-block; padding: 4px 10px; border-radius: 8px; font-size: 11px;
            font-weight: 600; background: rgba(229, 193, 88, 0.15); color: var(--accent-gold);

            color: #ffd778; white-space: nowrap;
        }

        .status-select {
            padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600;
            border: 1px solid transparent; cursor: pointer; outline: none; transition: 0.2s;

            background: #181413; border: 1px solid var(--accent-gold); border-radius: 14px;

let currentStatusFilter = "all";
const apiBase = (window.location.protocol === "file:" ? "http://localhost:3001" : "");

async function loadOrders() {
    try {
        const res = await fetch(apiBase + "/api/crm/orders");
        const data = await res.json();
        if (data.success && Array.isArray(data.orders)) {
            allOrders = data.orders;
        }
    } catch (err) {
        console.warn("API fetch warning, using pre-rendered dataset:", err);
    }
    updateCounters();
    applyFilters();
}

function updateCounters() {
    const elAll = document.getElementById("countAll");
    const elNew = document.getElementById("countNew");
    const elContacted = document.getElementById("countContacted");
    const elPending = document.getElementById("countPending");
    const elPaid = document.getElementById("countPaid");
    const elRejected = document.getElementById("countRejected");

    if (elAll) elAll.innerText = allOrders.length;
    if (elNew) elNew.innerText = allOrders.filter(o => o.status === "новая").length;
    if (elContacted) elContacted.innerText = allOrders.filter(o => o.status === "связались").length;
    if (elPending) elPending.innerText = allOrders.filter(o => o.status === "согласование").length;
    if (elPaid) elPaid.innerText = allOrders.filter(o => o.status === "оплачено").length;
    if (elRejected) elRejected.innerText = allOrders.filter(o => o.status === "отказ").length;
}

function setStatusFilter(status) {
    currentStatusFilter = status;
    document.querySelectorAll("#statusFilterPills .pill").forEach(p => {
        p.classList.toggle("active", p.getAttribute("data-status") === status);
    });
    applyFilters();
}

function applyFilters() {
    const searchInput = document.getElementById("searchInput");
    const query = (searchInput ? searchInput.value : "").toLowerCase().trim();
    const tbody = document.getElementById("ordersTableBody");
    if (!tbody) return;

    const filtered = allOrders.filter(o => {
        const matchesStatus = (currentStatusFilter === "all") || (o.status === currentStatusFilter);
        const matchesQuery = !query || 
            String(o.number || "").includes(query) ||
            (o.name && o.name.toLowerCase().includes(query)) ||
            (o.phone && o.phone.toLowerCase().includes(query)) ||
            (o.comment && o.comment.toLowerCase().includes(query)) ||
            (o.type && o.type.toLowerCase().includes(query));
        return matchesStatus && matchesQuery;
    });

    if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" class="empty-state">Заявок не найдено</td></tr>';
        return;
    }

    const rows = filtered.map(o => {
        const dateStr = o.date ? (o.date + " в " + (o.time || "19:00")) : new Date(o.createdAt).toLocaleDateString("ru-RU");
        const rawPhone = o.phone ? o.phone.replace(/[^0-9+]/g, "") : "";
        const amountFormatted = (Number(o.amount) || 0).toLocaleString("ru-RU");
        const statusClass = "status-" + o.status;

        const optNew = o.status === "новая" ? "selected" : "";
        const optContacted = o.status === "связались" ? "selected" : "";
        const optPending = o.status === "согласование" ? "selected" : "";
        const optPaid = o.status === "оплачено" ? "selected" : "";
        const optRejected = o.status === "отказ" ? "selected" : "";

        return [
            '<tr>',
            '<td class="order-num">#' + (o.number || o.id) + '</td>',
            '<td style="white-space: nowrap;">' + escapeHtml(dateStr) + '</td>',
            '<td><span class="guest-name">' + escapeHtml(o.name) + '</span></td>',
            '<td><a href="tel:' + rawPhone + '" class="guest-phone">📞 ' + escapeHtml(o.phone) + '</a></td>',
            '<td><span class="badge-type">' + escapeHtml(o.type || "Столик") + '</span></td>',
            '<td style="text-align: center; font-weight: 600;">' + (o.guests || 2) + ' чел.</td>',
            '<td class="amount-tag">' + amountFormatted + ' ₽</td>',
            '<td><span style="color: var(--text-muted); font-size: 12px;">' + escapeHtml(o.source || "Сайт") + '</span></td>',
            '<td>',
            '<select class="status-select ' + statusClass + '" data-order-id="' + o.id + '" onchange="changeStatus(this.getAttribute(\'data-order-id\'), this.value, this)">',
            '<option value="новая" ' + optNew + '>Новая</option>',
            '<option value="связались" ' + optContacted + '>Связались</option>',
            '<option value="согласование" ' + optPending + '>Согласование</option>',
            '<option value="оплачено" ' + optPaid + '>Оплачено / Бронь</option>',
            '<option value="отказ" ' + optRejected + '>Отказ</option>',
            '</select>',
            '</td>',
            '<td style="color: var(--text-muted); font-size: 12px; max-width: 220px; word-break: break-word;">' + escapeHtml(o.comment || "—") + '</td>',
            '</tr>'
        ].join('');
    });

    tbody.innerHTML = rows.join('');
}

async function changeStatus(id, newStatus, selectElem) {
    try {
        const res = await fetch(apiBase + "/api/crm/orders/" + id, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status: newStatus })
        });
        const data = await res.json();
        if (data.success) {
            selectElem.className = "status-select status-" + newStatus;
            showToast("Статус заявки #" + (data.order?.number || id) + " изменен на «" + newStatus + "»");
            const idx = allOrders.findIndex(o => o.id === id);
            if (idx !== -1) {
                allOrders[idx].status = newStatus;
                updateCounters();
            }
        } else {
            throw new Error(data.error);
        }
    } catch (err) {
        showToast("Ошибка: " + err.message, true);
        loadOrders();
    }
}

function showToast(msg, isError = false) {
    const toast = document.getElementById("toast");
    if (!toast) return;
    toast.innerText = (isError ? "⚠️ " : "✅ ") + msg;
    toast.style.display = "block";
    toast.style.borderColor = isError ? "#ef4444" : "#e5c158";
    setTimeout(() => { toast.style.display = "none"; }, 3000);
}

function escapeHtml(str) {
    if (!str) return "";
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

document.addEventListener("DOMContentLoaded", () => {
    updateCounters();
    applyFilters();
    loadOrders();
});
