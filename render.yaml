services:
  - type: worker
    name: korpusm-telegram-bot
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MASTER_CHAT_ID
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
